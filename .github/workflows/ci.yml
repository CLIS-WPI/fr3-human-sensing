name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas matplotlib pyarrow pydantic pyyaml scipy "ruff==0.7.4" "pytest>=8.0"
      - run: pip install -e .
      - run: ruff check src tests
      - run: pytest -q tests/unit
      - run: bash scripts/reproduce_figures.sh
